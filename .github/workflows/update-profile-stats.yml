name: Update profile statistics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub analytics cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: Yashzz26
        run: python scripts/update_stats.py

      - name: Commit changed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/activity.svg cards/contributions.svg cards/github-stats.svg cards/top-languages.svg cards/streak.svg
          if git diff --cached --quiet; then
            echo "No profile card changes to commit."
          else
            git commit -m "chore: update profile analytics cards"
            git push
          fi
